                        "surface-dim": "#d8dadc",
                        "on-secondary-fixed": "#00174b",
                        "secondary-fixed-dim": "#b4c5ff",

                        "on-secondary-fixed-variant": "#003ea8",
                        "inverse-surface": "#2d3133",

                        "secondary-fixed": "#dbe1ff",
                        "primary": "#000000",

<body
    class="bg-background text-on-surface antialiased min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop">
    <div class="w-full max-w-[440px]" id="app" data-v-app=""><!-- Authentication Card -->
        <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-8 shadow-lg">
            <!-- Branding / Header -->
            <div class="flex flex-col items-center mb-10">
                <div
                    class="h-12 w-12 bg-primary-container rounded-lg flex items-center justify-center mb-4 text-on-primary">
                    <span class="material-symbols-outlined" style="font-size: 28px;">router</span></div>
                <h1 class="font-headline-md text-headline-md text-on-surface text-center mb-2 tracking-tight">Admin
                    Login</h1>
                <p class="font-label-md text-label-md text-on-surface-variant text-center uppercase tracking-wider">
                    Login Admin Account</p>
            </div>
            <!-- Global Error Message -->
            <div v-if="errors.general" class="mb-4 text-center text-red-700 font-medium">{{ errors.general }}</div>
            <!-- Login Form -->
            <form @submit.prevent="handleLogin" class="space-y-5" novalidate>
                <!-- Email Field -->
                <div>
                    <label class="block font-label-md text-label-md text-on-surface-variant mb-base" for="email">Email</label>
                    <div class="relative">
                        <input v-model="email" :disabled="isLoading" class="w-full px-sm py-xs border rounded bg-surface-container-lowest font-body-md text-body-md transition-colors outline-none input-glow border-outline-variant focus:border-secondary focus:ring-1 focus:ring-secondary text-on-surface" id="email" placeholder="admin@campus.edu" type="email">
                    </div>
                    <p v-if="errors.email" class="mt-2 text-sm text-red-600">{{ errors.email }}</p>
                </div>

                <!-- Password Field -->
                <div>
                    <div class="flex items-center justify-between mb-base">
                        <label class="block font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
                        <a class="font-label-md text-label-md text-secondary hover:underline" href="#">Forgot?</a>
                    </div>
                    <div class="relative">
                        <input v-model="password" :disabled="isLoading" class="w-full px-sm py-xs border rounded bg-surface-container-lowest font-body-md text-body-md transition-colors outline-none input-glow border-outline-variant focus:border-secondary focus:ring-1 focus:ring-secondary text-on-surface" id="password" placeholder="••••••••" type="password">
                    </div>
                    <p v-if="errors.password" class="mt-2 text-sm text-red-600">{{ errors.password }}</p>
                </div>

                <!-- Submit Button -->
                <button :disabled="isLoading" class="w-full flex items-center justify-center py-xs px-sm bg-secondary text-on-secondary font-label-md text-label-md rounded transition-colors hover:bg-[#003ea8] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-secondary disabled:opacity-70 disabled:cursor-not-allowed mt-2 h-12 font-medium" type="submit">
                    <span v-if="isLoading">Signing in...</span>
                    <span v-else>Sign in</span>
                </button>
            </form>
        </div><!-- Footer Link -->
        <div class="mt-6 text-center">
            <p class="font-body-md text-body-md text-on-surface-variant"> Need admin access? <a
                    class="text-secondary font-medium hover:underline focus:outline-none focus:ring-2 focus:ring-secondary focus:ring-offset-2 rounded"
                    target="_blank" rel="noopener" href="../admin_registration/code.html">Register for an account</a></p>
        </div>
    </div>
    <script>
        const { createApp, ref } = Vue;

        createApp({
            setup() {
                const email = ref('');
                const password = ref('');
                const isLoading = ref(false);
                const errors = ref({
                    email: '',
                    password: '',
                    general: ''
                });

                const validateEmail = (emailStr) => {
                    return String(emailStr)
                        .toLowerCase()
                        .match(
                            /^(([^<>()[\]\\.,;:\s@"]+(\.[^<>()[\]\\.,;:\s@"]+)*)|.(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/
                        );
                };

                const handleLogin = async () => {
                    // Reset state
                    errors.value = { email: '', password: '', general: '' };
                    let isValid = true;

                    // Validation
                    if (!email.value) {
                        errors.value.email = 'Email address is required.';
                        isValid = false;
                    } else if (!validateEmail(email.value)) {
                        errors.value.email = 'Please enter a valid email format.';
                        isValid = false;
                    }

                    if (!password.value) {
                        errors.value.password = 'Password is required.';
                        isValid = false;
                    }

                    if (!isValid) return;

                    // Mock Async Submission
                    isLoading.value = true;

                    try {
                        await new Promise(resolve => setTimeout(resolve, 800));

                        // Mock failure condition for demonstration
                        if (email.value === 'fail@admin.com') {
                            errors.value.general = 'The email or password you entered is incorrect.';
                        } else {
                            // Success redirect
                            window.location.href = '/admin/dashboard';
                        }
                    } catch (error) {
                        errors.value.general = 'An unexpected error occurred. Please try again.';
                    } finally {
                        isLoading.value = false;
                    }
                };

                return {
                    email,
                    password,
                    isLoading,
                    errors,
                    handleLogin
                };
            }
        }).mount('#app');
    </script>


</body>
